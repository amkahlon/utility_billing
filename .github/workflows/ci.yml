# CI (review of 2026-11-18, step 3): on every push to main and every pull request, build a fresh bench (Frappe 16, no ERPNext),
# install the app on a new site, run the unit and integration tests, then the HTTP end-to-end suite against a running server.
# It is the regression gate's test part on a clean machine; the ERPNext clash check and the visual check stay with the local gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests and end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SITE: qa.localhost
      DB_ROOT_PASSWORD: ci-root  # a throwaway database inside this job

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis-cache:
        image: redis:7-alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:7-alpine
        ports:
          - 11000:6379

    steps:
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: System packages (database client, PDF tool with patched Qt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq mariadb-client libcups2 xvfb fontconfig xfonts-75dpi xfonts-base
          curl -fsSL -o /tmp/wkhtml.deb https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-3/wkhtmltox_0.12.6.1-3.jammy_amd64.deb
          sudo apt-get install -yq /tmp/wkhtml.deb
          wkhtmltopdf --version

      - name: Database settings Frappe needs
        run: |
          mariadb --host 127.0.0.1 --port 3306 -u root -p"$DB_ROOT_PASSWORD" -e "
            SET GLOBAL character_set_server = 'utf8mb4';
            SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Bench with Frappe 16
        run: |
          pip install -q frappe-bench
          npm install -g yarn
          bench init --skip-redis-config-generation --frappe-branch version-16 --python "$(which python)" "$HOME/frappe-bench"
          cd "$HOME/frappe-bench"
          bench set-config -g db_host 127.0.0.1
          bench set-config -gp db_port 3306
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:13000
          bench set-config -gp webserver_port 8000

      - name: Install the app on a new site
        working-directory: /home/runner/frappe-bench
        run: |
          ADMIN_PASSWORD="$(openssl rand -hex 12)"
          echo "QA_ADMIN_PASSWORD=$ADMIN_PASSWORD" > "$HOME/.dev-secrets"   # where the end-to-end suite reads it
          bench get-app utility_billing "$GITHUB_WORKSPACE/app"
          bench new-site "$SITE" --db-root-username root --db-root-password "$DB_ROOT_PASSWORD" --mariadb-user-host-login-scope='%' \
            --admin-password "$ADMIN_PASSWORD" --install-app utility_billing
          bench --site "$SITE" set-config allow_tests 1
          bench --site "$SITE" set-config -p throttle_user_limit 5000
          bench --site "$SITE" set-config developer_mode 0
          # the address PDFs fetch the site's own scripts from: the server this job starts on port 8000
          bench --site "$SITE" set-config host_name "http://$SITE:8000"
          echo "127.0.0.1 $SITE" | sudo tee -a /etc/hosts > /dev/null
          bench --site "$SITE" execute utility_billing.qa_support.mark_setup_complete
          bench --site "$SITE" list-apps

      - name: Start the web server and a worker (PDFs fetch the site's own assets; large runs post in the background)
        working-directory: /home/runner/frappe-bench
        run: |
          nohup bench worker --queue short,default,long > "$HOME/worker.log" 2>&1 &
          nohup bench --site "$SITE" serve --port 8000 --noreload > "$HOME/serve.log" 2>&1 &
          for _ in $(seq 1 60); do curl -s -o /dev/null -H "Host: $SITE" http://127.0.0.1:8000/api/method/ping && break; sleep 1; done
          curl -s -H "Host: $SITE" http://127.0.0.1:8000/api/method/ping

      - name: Unit and integration tests
        working-directory: /home/runner/frappe-bench
        run: |
          set -o pipefail
          bench --site "$SITE" run-tests --app utility_billing 2>&1 | sed "s/\x1b\[[0-9;]*m//g" | tee "$HOME/tests.log" | grep -E "✖|^FAIL|^ERROR|^Ran |^OK|^FAILED" || true
          # every "Ran" must be followed by OK (the same rule as e2e/regression.sh)
          ran=$(grep -c '^Ran ' "$HOME/tests.log" || true); ok=$(grep -c '^OK' "$HOME/tests.log" || true)
          if [ "$ran" -eq 0 ] || [ "$ran" -ne "$ok" ] || grep -qE "^FAILED|^ERROR" "$HOME/tests.log"; then
            echo "::error::unit or integration tests failed"; grep -E "^ ?(ERROR|FAIL) " -A30 "$HOME/tests.log" | grep -vE "^[[:space:]]+(File \"/home/runner/frappe-bench/(env|apps/frappe)|[a-z_]+ = )" | head -200; exit 1
          fi

      - name: End-to-end over HTTP
        working-directory: /home/runner/frappe-bench
        run: |
          E2E_URL=http://127.0.0.1:8000 env/bin/python apps/utility_billing/e2e/run_e2e.py > "$HOME/e2e.log" 2>&1 || status=$?
          grep -E "^FAIL" "$HOME/e2e.log" | cut -c1-400 || true
          tail -1 "$HOME/e2e.log"
          exit "${status:-0}"

      - name: Browser tests of the main screens (real Chromium)
        working-directory: /home/runner/frappe-bench
        run: |
          pip install -q playwright
          playwright install --with-deps chromium > "$HOME/playwright-install.log" 2>&1 || { tail -20 "$HOME/playwright-install.log"; exit 1; }
          E2E_BROWSER_URL=http://qa.localhost:8000 python apps/utility_billing/e2e/run_browser.py

      - name: Keep the logs when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            /home/runner/tests.log
            /home/runner/e2e.log
            /home/runner/serve.log
            /home/runner/worker.log
            /home/runner/browser-shots/
          if-no-files-found: ignore
          retention-days: 7
